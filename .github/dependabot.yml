version: 2
updates:
  # Python dependencies (Poetry)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - "SamuelJennings"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore"
      include: "scope"
    # mvp-shared is a git dependency pinned to a tag. Dependabot's Poetry
    # updater raises `mvp-shared | unknown_error` on it and aborts the whole
    # job ("run update_files", exit 1) — which silently stalls every OTHER
    # Python update in this repo, security ones included. Support for
    # tag-pinned Poetry git deps is recent (dependabot-core #13944) and still
    # buggy, and mvp-shared's tag does not match the version it declares, so
    # Dependabot cannot form a coherent bump. Ignoring it keeps the rest of
    # the group flowing; bump the tag by hand when a shared release lands.
    # Revisit if mvp-shared is ever published to an index.
    ignore:
      - dependency-name: "mvp-shared"
    groups:
      python-dependencies:
        patterns:
          - "*"

  # Tailwind/DaisyUI toolchain for the prebuilt stylesheet.
  # NOTE: a bump here does not regenerate dac/static/css/dac.css — run
  # `npm run build:css` and commit the result before merging one of these.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 3
    reviewers:
      - "SamuelJennings"
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      npm-dependencies:
        patterns:
          - "*"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 3
    reviewers:
      - "SamuelJennings"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"
