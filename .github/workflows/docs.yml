name: Deploy Docs

# Docs build is not yet configured. Re-enable the push trigger when mkdocs (or equivalent) is set up.
on:
  workflow_dispatch:

# The reusable workflow has a Pages deploy job that needs these permissions. A
# caller that does not grant them fails at startup, even when deploy is skipped.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  call-docs:
    uses: django-mvp/shared/.github/workflows/docs.yml@v0.6.0
    secrets: inherit
