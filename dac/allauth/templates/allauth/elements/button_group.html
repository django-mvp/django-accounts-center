{% load allauth %}
{% if attrs.vertical %}
  {% comment %} collapse pinned False so the group can't inherit mvp's ambient `collapse` sidebar context var on in-shell pages. {% endcomment %}
  <c-mvp.group class="my-4" :collapse="False" :row="False">
    {% slot %}
    {% endslot %}
  </c-mvp.group>
{% else %}
  <c-mvp.group row wrap class="items-center my-4">
    {% slot %}
    {% endslot %}
  </c-mvp.group>
{% endif %}
