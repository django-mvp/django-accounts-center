{% load allauth %}

<c-mvp.card class="mb-4">
  <c-slot name="title">
    {% slot title %}
    {% endslot %}
  </c-slot>
  {% slot body %}
  {% endslot %}
  {% if slots.actions %}
    <c-slot name="footer">
      {% for action in slots.actions %}{{ action }}{% endfor %}
    </c-slot>
  {% endif %}
</c-mvp.card>
