
[project]
name = "django-accounts-center"
description = "The account-management layer for django-mvp projects: an Account Center, an entrance layout, and a system for integrating third-party account apps."
license = "MIT"
dynamic = ["version"]
readme = "README.md"
authors = [{ name = "Sam", email = "samuel.scott.jennings@gmail.com" }]
requires-python = ">=3.12,<4.0"
dependencies = [
    # Bounds are the ranges CI actually verifies (5.2 and 6.0), per Article XV.
    "django (>=5.2.17,<7.0)",
    "django-mvp (>=0.19.2,<1.0)",
]

[project.optional-dependencies]
# Each integration sub-app ("dac.allauth", …) has a matching extra.
# crispy-forms/-tailwind back mvp's <c-form.render>, which dac.allauth uses to
# render allauth forms; mvp treats crispy as consumer-provided, so declare it
# here rather than relying on it transitively.
allauth = [
    # Capped at the current major: the integration is coupled to allauth's
    # element and layout template vocabulary, which a major release may change.
    "django-allauth[socialaccount,mfa] (>=65.18,<66.0)",
    "django-crispy-forms (>=2.6,<3.0)",
    "crispy-tailwind (>=1.0.3,<2.0)",
]

[tool.poetry]
version = "0.7.1"
packages = [{ include = "dac" }]
requires-poetry = '>=2.0,<3.0'

[tool.poetry.group.dev.dependencies]
django-allauth = { extras = ["mfa", "socialaccount"], version = "^65.19.1" }
# Back mvp's <c-form.render> (used by dac.allauth's fields.html). Also declared
# in the `allauth` extra for consumers; here so a dev `poetry install` gets a
# working crispy_tailwind (tailwind_filters) rather than a partial one.
django-crispy-forms = "^2.7"
crispy-tailwind = "^1.0.3"
python-dotenv = "^1.2.3"
django-extensions = "^4.1"
beautifulsoup4 = "^4.14.3"
# Family dev/test toolchain: ruff, mypy, deptry, pre-commit, pytest,
# pytest-django, factory-boy, coverage, django-stubs. Pinned to the shared
# release tag — never @main (django-mvp/shared ADR 0001).
mvp-shared = { git = "https://github.com/django-mvp/shared.git", tag = "v0.2.0", extras = [
    "dev",
    "test",
] }
pytest-playwright = "^0.9.0"

# [tool.poetry.group.local.dependencies]
# django-mvp = { path = "../django-mvp", develop = true }

[build-system]
requires = ['poetry-core (>=2.0,<3.0)']
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py312"
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "*/migrations/*.py",
    "staticfiles/*",
    "docs/",
    ".github/",
]
line-length = 120
fix = true

[tool.ruff.lint]
select = [
    # flake8-2020
    "YTT",
    # flake8-bandit
    "S",
    # flake8-bugbear
    "B",
    # flake8-builtins
    "A",
    # flake8-comprehensions
    "C4",
    # flake8-debugger
    "T10",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # mccabe
    "C90",
    # pycodestyle
    "E",
    "W",
    # pyflakes
    "F",
    # pygrep-hooks
    "PGH",
    # pyupgrade
    "UP",
    # ruff
    "RUF",
    # tryceratops
    "TRY",
]
ignore = [
    # LineTooLong
    "E501",
    # DoNotAssignLambda
    "E731",
    # ClassAttributesShouldBeAnnotated
    "RUF012",
    "TRY003",
    "A003",
    "F403",
    "F405",
    "C901",
]

[tool.ruff.lint.per-file-ignores]
# The old "**/tests/*" glob only matched files directly inside a tests dir, so
# nothing under tests/test_allauth/ was covered. "tests/**" matches the tree.
# S101 asserts are the point of a test; S105/S106 flag the dummy credentials
# every auth test needs; RUF002/003 flag en dashes in test prose.
"tests/**" = ["S101", "S105", "S106", "S107", "RUF002", "RUF003"]
"screenshots/**" = ["S101", "S105", "S106", "S107", "RUF002", "RUF003"]
"example/**" = ["S105", "S106", "S107", "RUF002", "RUF003"]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 88
line-ending = "lf"
exclude = ["*/migrations/*.py"]

[tool.djlint]
blank_line_after_tag = "load,endpartialdef,endblock"
close_void_tags = true
custom_blocks = "element,slot"
custom_html = "django-formset,c-[\\w.-]+,swiper-container,swiper-slide"
format_js = true
format_css = true
indent = 2
max_attribute_length = 50
max_blank_lines = 0
max_line_length = 119
ignore = "H016,H030,H031,H021,D018,H037"
format_attribute_template_tags = false

[tool.djlint.css]
indent_size = 2


[tool.djlint.js]
indent_size = 2


[tool.mypy]
files = ["dac"]
disallow_untyped_defs = "False"
disallow_any_unimported = "False"
ignore_missing_imports = "True"
no_implicit_optional = "True"
check_untyped_defs = "False"
warn_return_any = "True"
warn_unused_ignores = "True"
follow_imports = "skip"
pretty = "True"
exclude = [
    "docs/",
    "migrations/",
    "tests/settings.py",
]
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "tests.settings"


[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
filterwarnings = ["ignore", "default:::keywords"]
addopts = "--cov --cov-report html"
# Playwright browser configuration
playwright_browser_type = "chromium"
playwright_launch_args = ["--headless"]
# Allow Django synchronous DB operations inside pytest-playwright's async event loop
env = ["DJANGO_ALLOW_ASYNC_UNSAFE=1"]

[tool.coverage.report]
skip_empty = true
show_missing = "true"

[tool.coverage.run]
branch = "true"
omit = [
    "*site-packages*",
    "*/tests/*",
    "*.tox*",
    "*__init__.py",
    "*/migrations/*",
]


[tool.deptry]
extend_exclude = ["tasks.py", "docs", ".*tests"]

[tool.deptry.package_module_name_map]
django-mvp = ["mvp"]
django-allauth = ["allauth"]
django-flex-menus = ["flex_menu"]
python-dotenv = ["dotenv"]

[tool.deptry.per_rule_ignores]
# flex_menu/allauth/crispy_forms are optional or transitive; pytest comes via git deps
DEP001 = [
    "invoke",
    "flex_menu",
    "pytest",
    "allauth",
    "crispy_forms",
]
# django-crispy-forms/crispy-tailwind back mvp's <c-form.render> and dac's allauth
# templates purely through crispy's Django template tags and CRISPY_TEMPLATE_PACK —
# dac's own .py files never import them. flex_menu is a transitive dep of django-mvp
# (see DEP001 above), same reasoning applies to its direct import in menus.py.
DEP002 = ["django-crispy-forms", "crispy-tailwind"]
DEP003 = ["toml", "flex_menu", "pytest"]
# dotenv is used in example/ (dev-only app), not in the published package
DEP004 = ["dotenv"]
